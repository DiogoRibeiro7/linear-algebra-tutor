name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend Lint and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ruff
        run: ruff check backend/app

      - name: Mypy
        run: mypy backend/app --ignore-missing-imports

      - name: Pytest
        run: |
          if [ -d backend/tests ] || [ -f backend/pytest.ini ] || [ -f backend/pyproject.toml ]; then
            pytest backend
          else
            echo "No backend tests configured yet. Skipping pytest."
          fi

  frontend:
    name: Frontend Lint, Typecheck, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Tests (if configured)
        run: |
          if npm run | grep -q "test"; then
            npm test -- --runInBand
          else
            echo "No frontend test script configured yet. Skipping tests."
          fi
        working-directory: frontend

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t linalg-backend ./backend

      - name: Build frontend image
        run: docker build -t linalg-frontend ./frontend
