name: Frontend

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn tsc --noEmit

      - name: Tests
        run: yarn test

      - name: Anna material index tests
        run: yarn test:anna-materials

      - name: Build
        run: yarn build

      - name: Build Anna bundle
        run: yarn build:anna

      - name: Validate Anna manifest and permissions
        run: yarn validate:anna
