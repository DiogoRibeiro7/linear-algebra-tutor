[pytest]
asyncio_mode = auto
testpaths = tests
# --cov gates against regression at the current measured baseline. Raise the
# threshold as coverage improves; do not lower it without an explicit reason.
addopts =
    -ra
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-fail-under=68
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:pydantic.*
