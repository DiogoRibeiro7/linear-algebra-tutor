# Alembic configuration for the Linear Algebra Tutor backend.
#
# The actual database URL is read from the DATABASE_URL env var at runtime
# (see migrations/env.py). The value here is only the default for cases
# where the env var is missing, and it intentionally uses the sync sqlite
# driver because alembic's command runner is synchronous.

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///./linalg_tutor.db

# File-naming template includes a UTC timestamp + slug for stable ordering.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
